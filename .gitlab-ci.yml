stages:
  - check
  - test
  - analysis
  - build

variables:
  CI_REGISTRY: gitlab.sintef.no:5050
  IMAGE_PATH: $CI_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
  DOCKER_TLS_CERTDIR: ''
  PUBLIC_SINDIT_BACKEND_API: http://0.0.0.0:9017
  PUBLIC_SINDIT_BACKEND_API_BASE_URI: http://

.base-rules:
  rules:
    # Always run on default branch (main)
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    # Run on merge requests
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    # Avoid duplicate jobs on merge requests
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Run if on a branch and not a merge request
    - if: $CI_COMMIT_BRANCH

check:
  stage: check
  extends: .base-rules
  image: alpine:latest
  script:
    - echo "This step always passes."

npm-test:
  stage: test
  image: node:23
  extends: .base-rules
  script:
    - npm install
    - npm run coverage
    - ls -la ./coverage
  artifacts:
    when: always
    expire_in: 1 weeks
    paths:
      - coverage
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

sonarqube:
  stage: analysis
  extends: .base-rules
  dependencies:
    - npm-test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: ['']
  variables:
    SONAR_USER_HOME: .sonar
    GIT_DEPTH: '0'
  cache:
    key: $CI_JOB_NAME
    paths:
      - .sonar/cache
  script:
    - pwd
    - ls -la
    - sonar-scanner
  allow_failure: true

# Docker Build Instructions:
# This job only runs when a Git tag starting with "v" is created.
# To trigger a Docker build:
#   git tag v1.0.0
#   git push origin v1.0.0
# The image will be tagged with: 1.0.0 (version without prefix) and latest
docker-build:
  stage: build
  image: docker:latest
  tags:
    - dind
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    IMAGE_NAME: sindit-frontend
  allow_failure: false
  before_script:
    - |
      echo "$CI_JOB_TOKEN" | docker login $CI_REGISTRY \
      -u $CI_REGISTRY_USER --password-stdin
    - docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
    - docker buildx create --name mybuilder --use
    # Extract version from tag (remove "v" prefix)
    - export IMAGE_VERSION=${CI_COMMIT_TAG#v}
  script: docker buildx build
    --push
    --platform linux/arm64/v8,linux/amd64
    --provenance=false
    --label "git-commit-sha=$CI_COMMIT_SHA"
    --label "git-commit-branch=$CI_COMMIT_BRANCH"
    --label "git-commit-timestamp=$CI_COMMIT_TIMESTAMP"
    --label "git-commit-title=$CI_COMMIT_TITLE"
    --label "git-tag=$CI_COMMIT_TAG"
    -t $IMAGE_PATH/$IMAGE_NAME:$IMAGE_VERSION
    -t $IMAGE_PATH/$IMAGE_NAME:latest .
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

push-to-github:
  stage: build
  image: alpine:latest
  before_script:
    - apk add --no-cache git openssh
    - git config --global user.email "ci@sindit.com"
    - git config --global user.name "SINDIT CI"
  script:
    - git push --force https://$GITHUB_TOKEN@github.com/SINTEF-9012/SINDIT20-Frontend.git HEAD:main
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
